<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Waveform de Linha</title>
  <style>
    body {
      background-color: #0d0d11;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
h1 {
  font-family: ;
  padding-bottom: 200px;
}
    canvas {
      width: 93%;
      background: #000;
      border: 2px solid #222;
      border-radius: 8px;
      box-shadow: 0 0 20px #5dc1d099;
    }
    .controls {
      margin-bottom: 20px;
    }
#audio {
  border-radius: 100px;
  width: 50%;
}
#fileInput {
  display: block;
  margin: auto;
  margin-bottom: 20px;
  border: 1px solid #5dc1d0;
  padding: 13px;
  width: 50%;
}
  </style>
</head>
<body>

  <div class="controls">
    <input type="file" id="fileInput" accept="audio/*">
    <audio id="audio" controls></audio>
  </div>

  <canvas id="canvas" width="800" height="300"></canvas>

  <script>
    const fileInput = document.getElementById('fileInput');
    const audio = document.getElementById('audio');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let audioCtx, analyser, source;

    // Carrega o áudio
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        audio.src = URL.createObjectURL(file);
        audio.play();
      }
    });

    // Inicia a Web Audio API ao dar Play
    audio.addEventListener('play', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048; // Resolução da linha

        source = audioCtx.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioCtx.destination);

        draw();
      }
    });

    // Renderiza a linha
    function draw() {
      requestAnimationFrame(draw);

      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      
      // Pega os dados do tempo (linha contínua)
      analyser.getByteTimeDomainData(dataArray);

      // Limpa a tela
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Estilo da linha
      ctx.lineWidth = 2;
      ctx.strokeStyle = '#5dc1d0'; // Verde neon estilo osciloscópio
      ctx.beginPath();

      const sliceWidth = canvas.width / bufferLength;
      let x = 0;

      for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = (v * canvas.height) / 2;

        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }

        x += sliceWidth;
      }

      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.save()
      ctx.strokeStyle = '#5dc1d0';
      ctx.shadowColor = '#5dc1ff';
      ctx.shadowBlur = 18;
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.stroke();
    }
 let db = null;

    // 1. Inicializa o Banco de Dados do Navegador (IndexedDB)
    const dbRequest = indexedDB.open('AudioStorageDB', 1);

    dbRequest.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('songs')) {
        db.createObjectStore('songs');
      }
    };

    dbRequest.onsuccess = (e) => {
      db = e.target.result;
      carregarUltimaMusica(); // Carrega a música salva assim que abre a página
    };

    // 2. Salva o áudio no banco e toca ao escolher um arquivo
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        salvarMusicaNoBanco(file);
        audio.src = URL.createObjectURL(file);
        audio.play().catch(() => {});
      }
    });

    // 3. Função para salvar o arquivo de áudio no IndexedDB
    function salvarMusicaNoBanco(file) {
      if (!db) return;
      const transaction = db.transaction(['songs'], 'readwrite');
      const store = transaction.objectStore('songs');
      store.put(file, 'lastSong');
    }

    // 4. Função para resgatar a música salva ao recarregar a página
    function carregarUltimaMusica() {
      if (!db) return;
      const transaction = db.transaction(['songs'], 'readonly');
      const store = transaction.objectStore('songs');
      const getRequest = store.get('lastSong');

      getRequest.onsuccess = () => {
        const file = getRequest.result;
        if (file) {
          audio.src = URL.createObjectURL(file);
        }
      };
    }
  </script>
</body>
</html>
